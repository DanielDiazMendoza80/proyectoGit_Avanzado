name: Prueba de tokens

on: [push]

jobs:
  probar:
    runs-on: self-hosted
    steps:
      - name: Comparar variable con secreto local
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
          LOCAL_DEV_TOKEN: ${{ vars.LOCAL_DEV_TOKEN }}
        shell: pwsh
        run: |
          if ($env:DEV_TOKEN -and
              $env:LOCAL_DEV_TOKEN -and
              $env:DEV_TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Host "CORRECTO: los tokens coinciden."
          } else {
            Write-Host "ERROR: los tokens no coinciden o falta una variable."
            exit 1
          }
