name: Prueba runner y secret
on: [push]
jobs:
  probar:
    runs-on: self-hosted
    steps:
      - name: Comparar secret con variable local
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ($env:DEV_TOKEN -eq $env:LOCAL_DEV_TOKEN)  {
            Write-Host "CORRECTO: los tokens coinciden."
          } else {
            Write-Host "ERROR: los tokens no coinciden."
            exit 1
          }
